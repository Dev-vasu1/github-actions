name: Terraform EC2

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  terraform:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Terraform code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Check Terraform version
      - name: Terraform Version
        run: terraform version

      # 5. Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # 6. Validate Terraform code
      - name: Terraform Validate
        run: terraform validate

      # 7. Format check
      - name: Terraform Format
        run: terraform fmt 

      # 8. Create Terraform plan
      - name: Terraform Plan
        run: terraform plan
